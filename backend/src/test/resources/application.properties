# ==============================================================================
# Isolated Test Configuration (In-Memory H2 Database)
# Tests never modify or reset external MySQL databases.
# ==============================================================================

spring.application.name=agri-marketplace-backend-test
spring.profiles.active=test
spring.datasource.url=jdbc:h2:mem:agri_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
