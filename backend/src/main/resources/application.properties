# ==============================================================================
# Cloud-Native AI Agri Marketplace - Backend Configuration
# ==============================================================================

spring.application.name=agri-marketplace-backend
server.port=8080

# ------------------------------------------------------------------------------
# Datasource Configuration (Parameterized via Environment Variables)
#
# Production / Local override variables:
#   DB_URL      : JDBC connection string
#   DB_USERNAME : Database username (default: root)
#   DB_PASSWORD : Database password (default: empty)
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agri_marketplace?createDatabaseIfNotExist=false&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# NOTE: ddl-auto=update is used strictly for this development milestone.
# Production deployments should use migration tools (Flyway or Liquibase).
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------------------------------------------------------
# Spring Boot Actuator
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ------------------------------------------------------------------------------
# AI Service Microservice Client Configuration
# ------------------------------------------------------------------------------
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.connect-timeout-ms=${AI_SERVICE_CONNECT_TIMEOUT_MS:5000}
ai.service.read-timeout-ms=${AI_SERVICE_READ_TIMEOUT_MS:5000}

