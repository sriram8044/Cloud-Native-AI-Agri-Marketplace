apiVersion: v1
kind: ConfigMap
metadata:
  name: agri-backend-config
  namespace: agri-marketplace
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: agri-marketplace
data:
  DB_URL: "jdbc:mysql://mysql-service:3306/agri_marketplace?createDatabaseIfNotExist=false&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
  DB_USERNAME: "agri_user"
  JPA_DDL_AUTO: "update"
  JPA_SHOW_SQL: "false"
  AI_SERVICE_URL: "http://ai-service:8000"
  AI_SERVICE_CONNECT_TIMEOUT_MS: "5000"
  AI_SERVICE_READ_TIMEOUT_MS: "5000"
  SERVER_PORT: "8080"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agri-ai-config
  namespace: agri-marketplace
  labels:
    app.kubernetes.io/component: ai-service
    app.kubernetes.io/part-of: agri-marketplace
data:
  HOST: "0.0.0.0"
  PORT: "8000"
