{{- if not .Values.mysql.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agri-marketplace.fullname" . }}-secrets
  labels:
    {{- include "agri-marketplace.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.mysql.auth.password | default "ChangeMe123!" | quote }}
  DB_ROOT_PASSWORD: {{ .Values.mysql.auth.rootPassword | default "ChangeRoot123!" | quote }}
{{- end }}
