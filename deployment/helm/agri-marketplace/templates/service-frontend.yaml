apiVersion: v1
kind: Service
metadata:
  name: {{ include "agri-marketplace.fullname" . }}-frontend
  labels:
    {{- include "agri-marketplace.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "agri-marketplace.name" . }}-frontend
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 80
      {{- if and (eq .Values.frontend.service.type "NodePort") .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
      name: http
  selector:
    app.kubernetes.io/name: {{ include "agri-marketplace.name" . }}-frontend
