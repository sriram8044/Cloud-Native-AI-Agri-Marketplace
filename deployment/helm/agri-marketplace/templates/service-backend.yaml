apiVersion: v1
kind: Service
metadata:
  name: {{ include "agri-marketplace.fullname" . }}-backend
  labels:
    {{- include "agri-marketplace.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "agri-marketplace.name" . }}-backend
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 8080
      name: http
  selector:
    app.kubernetes.io/name: {{ include "agri-marketplace.name" . }}-backend
