# ==============================================================================
# Default Helm Chart Values - Cloud-Native AI Agri Marketplace
# ==============================================================================

global:
  environment: production
  imageRegistry: ""

# ------------------------------------------------------------------------------
# MySQL 8 Database Configuration
# ------------------------------------------------------------------------------
mysql:
  enabled: true
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 3306
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  auth:
    database: agri_marketplace
    username: agri_user
    password: ""       # Supply via --set mysql.auth.password or values file
    rootPassword: ""   # Supply via --set mysql.auth.rootPassword or values file
    existingSecret: "" # Optional name of existing K8s Secret
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# ------------------------------------------------------------------------------
# FastAPI AI Microservice Configuration
# ------------------------------------------------------------------------------
aiService:
  image:
    repository: agri-marketplace/ai-service
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 8000
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 15
    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 10

# ------------------------------------------------------------------------------
# Spring Boot Backend Configuration
# ------------------------------------------------------------------------------
backend:
  image:
    repository: agri-marketplace/backend
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 8080
    type: ClusterIP
  env:
    jpaDdlAuto: update
    jpaShowSql: false
    connectTimeoutMs: 5000
    readTimeoutMs: 5000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  probes:
    liveness:
      path: /actuator/health/liveness
      initialDelaySeconds: 45
      periodSeconds: 15
    readiness:
      path: /actuator/health/readiness
      initialDelaySeconds: 30
      periodSeconds: 10

# ------------------------------------------------------------------------------
# React 18 Frontend Configuration
# ------------------------------------------------------------------------------
frontend:
  image:
    repository: agri-marketplace/frontend
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 80
    type: NodePort
    nodePort: 30080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  probes:
    liveness:
      path: /
      initialDelaySeconds: 15
      periodSeconds: 20
    readiness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 10
