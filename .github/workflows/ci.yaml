name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Spring Boot Backend Tests (Java 21 / Maven)
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Backend Tests
        working-directory: ./backend
        run: mvn clean test -B

  # ----------------------------------------------------------------------------
  # Job 2: AI Forecasting Microservice Tests (Python 3.11 / Pytest)
  # ----------------------------------------------------------------------------
  ai-service-test:
    name: AI Service Test (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        working-directory: ./ai-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        working-directory: ./ai-service
        run: python -m pytest

  # ----------------------------------------------------------------------------
  # Job 3: React Frontend Tests & Production Build (Node 22 / Vitest)
  # ----------------------------------------------------------------------------
  frontend-test-and-build:
    name: Frontend Test & Build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Vitest Unit Tests
        working-directory: ./frontend
        run: npm test -- --run

      - name: Build Production Bundle
        working-directory: ./frontend
        run: npm run build

  # ----------------------------------------------------------------------------
  # Job 4: Helm Chart & Kubernetes Manifest Validation
  # ----------------------------------------------------------------------------
  manifest-validation:
    name: Helm & Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.16.2'

      - name: Lint Helm Chart
        run: helm lint deployment/helm/agri-marketplace

      - name: Template Helm Chart (Default Values)
        run: helm template test deployment/helm/agri-marketplace

      - name: Template Helm Chart (Local Values)
        run: helm template test deployment/helm/agri-marketplace -f deployment/helm/agri-marketplace/values-local.yaml

      - name: Validate Kustomize Manifests
        run: kubectl kustomize deployment/k8s

  # ----------------------------------------------------------------------------
  # Job 5: Docker Container Build Verification (Dry Run)
  # ----------------------------------------------------------------------------
  docker-build-check:
    name: Docker Images Build Verification
    needs: [backend-test, ai-service-test, frontend-test-and-build, manifest-validation]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: agri-marketplace/backend:test

      - name: Build AI Service Image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          push: false
          tags: agri-marketplace/ai-service:test

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: agri-marketplace/frontend:test
